name: Windows

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  RUSTFLAGS: "-C target-feature=+crt-static"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Npcap SDK
        shell: pwsh
        run: |
          $sdk = Join-Path $env:RUNNER_TEMP "npcap-sdk.zip"
          $root = Join-Path $env:RUNNER_TEMP "npcap-sdk"
          Invoke-WebRequest -Uri "https://npcap.com/dist/npcap-sdk-1.16.zip" -OutFile $sdk
          Expand-Archive -Path $sdk -DestinationPath $root -Force
          $libFile = Get-ChildItem -Path $root -Filter "wpcap.lib" -File -Recurse | Select-Object -First 1
          if ($null -eq $libFile) { throw "Npcap SDK wpcap.lib was not found after extraction" }
          $lib = $libFile.Directory.FullName
          "LIBPCAP_LIBDIR=$lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build release binary
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $p = "package"
          New-Item -ItemType Directory -Force "$p/packaging" | Out-Null
          Copy-Item target/release/host-net-monitor.exe "$p/"
          Copy-Item config.windows.example.yaml,WINDOWS.md,README.md "$p/"
          Copy-Item packaging/host-net-monitor.winsw.xml,packaging/install-windows.ps1 "$p/packaging/"
          Compress-Archive -Path "$p/*" -DestinationPath host-net-monitor-windows-x86_64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: host-net-monitor-windows-x86_64
          path: host-net-monitor-windows-x86_64.zip
