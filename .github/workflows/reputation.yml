name: Threat reputation database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install updater dependencies
        run: python -m pip install -r tools/reputation/requirements.txt
      - name: Refresh database
        env:
          ABUSE_CH_AUTH_KEY: ${{ secrets.ABUSE_CH_AUTH_KEY }}
        run: python tools/reputation/update.py --config threat-reputation.config.json
      - name: Commit updated database
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mmdb/threat-reputation.mmdb mmdb/threat-reputation.mmdb.manifest.json
          git diff --cached --quiet || git commit -m "Update threat reputation database"
          git push
